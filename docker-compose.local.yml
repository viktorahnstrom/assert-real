# Local verification stack. Pulls the same GHCR images CI pushed.
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#
# Requires: docker login ghcr.io (see docs/local-verification.md)

name: assert-real-local

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    networks:
      - edge

  backend:
    image: ghcr.io/viktorahnstrom/assert-real-backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.local
    volumes:
      - app_data:/data
    expose:
      - '8000'
    deploy:
      resources:
        limits:
          memory: 5g
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    image: ghcr.io/viktorahnstrom/assert-real-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  edge:
    driver: bridge
